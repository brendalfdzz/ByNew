<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>by·new</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="https://kit.fontawesome.com/c96716c2ae.js" crossorigin="anonymous"></script>
        <link href="https://fonts.cdnfonts.com/css/lovelo?styles=25962" rel="stylesheet">
        <link href="https://fonts.cdnfonts.com/css/quicksand?styles=170041,738,741" rel="stylesheet">
        <link href="https://fonts.cdnfonts.com/css/julius-sans-one" rel="stylesheet">
        <link href="https://fonts.cdnfonts.com/css/raleway-5?styles=27267,27263" rel="stylesheet">
        <link href="https://fonts.cdnfonts.com/css/raleway-5?styles=27267" rel="stylesheet">
           
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!--header-->
        <header class="header">
            <div class="header-logo">
                <a href="index.html">
                    <img src="imagenes/logo.png" alt="img-logo">
                </a>
            </div>
            <div class="header-links">
                <a href="index.html#opciones">CONTRIBUYE</a>
                <a href="index.html#nosotros">NOSOTROS</a>
            </div>
            <div class="icono-perfil">
                <i class="fa-regular fa-user"></i>
            </div>
        </header>

        <div class="titulo-reciclaje">
            <h1>RECICLA TU PRENDA</h1>
        </div>

        <div class="advertencia-reciclar">
            <h5 class="titulo-condiciones-reciclar">CUANDO RECICLAR MI ROPA?</h5>
            <div class="lista-condiciones-reciclar">
                <ul>
                    <li>Esta rota</li>
                    <li>La tela esta muy desgastada</li>
                </ul>
            </div>
            <div class="alternativas-condiciones-reciclar">
                <p><u>Si todavia esta en buen estado, puedes optar por donarla o reutilizarla.</u></p>
                <div class="botones-alternativas-reciclar">
                    <a href="donar.html">
                        <button>Donar</button>
                    </a>
                    <a href="reutilizar.html">
                        <button>Reutilizar</button>
                    </a>
                </div>
            </div>
        </div>

        <form action="" class="formulario-reciclar">
            <div class="fila-form-reciclar">
                <div class="grupo-formulario-reciclar">
                    <label for="categoria-prenda-reciclar" class="nombre-prenda-reciclar">CATEGORÍA</label>
                    <select id="categoria-prenda-reciclar" class="form-select-reciclar" required>
                        <option value="" selected></option>
                        <option value="camisa">Camisa</option>
                        <option value="blusa">Blusa</option>
                        <option value="sudadera">Sudadera</option>
                        <option value="sueter">Sueter</option>
                        <option value="chamarra">Chamarra</option>
                        <option value="pantalon">Pantalon</option>
                        <option value="short">Short</option>
                        <option value="falda">Falda</option>
                        <option value="vestido">Vestido</option>
                    </select>
                </div>
                <div class="grupo-formulario-reciclar">
                    <label for="categoria_material-reciclar" class="material-prenda">MATERIAL</label>
                    <select id="categoria_material-reciclar" class="form-select-reciclar" required>
                        <option value="" selected></option>
                        <option value="algodon">Algodon</option>
                        <option value="mezclilla">Mezclilla</option>
                        <option value="poliester">Poliester</option>
                        <option value="lana">Lana</option>
                        <option value="lino">Lino</option>
                        <option value="cuero-piel">Cuero/Piel</option>
                    </select>
                </div>
            </div>
            <div class="fila-form-reciclar">
                <div class="grupo-formulario-reciclar">
                    <p class="condicion-apartado">CONDICION</p>
                    <div class="condicion">
                        <p>Rota</p>
                        <p>Desgastada</p>
                    </div>
                </div>
                <div class="grupo-formulario-reciclar">
                    <p class="destino-apartado-reciclar">RECOLECCIÓN</p>
                    <div class="opciones-destino-reciclar">
                        <button>LLevar a un centro</button>
                        <button>Solicitar recoleccion</button>
                    </div>
                </div>
            </div>
        </form>
        <button class="boton-enviar-reciclar">
            ENVIAR PRENDAS
        </button>
        <div class="icono-agregar-reciclar">
            <i class="fa-solid fa-plus"></i>
        </div>
        
    </body>
</html>
